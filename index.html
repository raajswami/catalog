<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Premium Masonry Catalog (Secure)</title>
<style>
  body{background:#000;margin:0;font-family:Arial;color:#fff;user-select:none;-webkit-user-drag:none;}
  .filter-bar{display:flex;justify-content:center;gap:15px;padding:20px;background:#000;position:sticky;top:0;z-index:100;}
  .filter-btn{padding:8px 16px;border:1px solid #fff;background:none;color:white;cursor:pointer;border-radius:4px;transition:0.3s;}
  .filter-btn.active,.filter-btn:hover{background:white;color:black;}
  .gallery{column-count:3;column-gap:18px;padding:20px;}
  .item{break-inside:avoid;margin-bottom:18px;cursor:pointer;}
  .thumb{width:100%;border-radius:5px;border:2px solid #fff;transition:0.3s;pointer-events:none;}
  .thumb:hover{transform:scale(1.03);} 
  .filename{text-align:center;margin-top:6px;opacity:0.7;font-size:14px;}
  #viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;z-index:1000;}
  #viewer img{max-width:90%;max-height:90%;border:2px solid #fff;}
  #closeBtn{position:absolute;top:20px;right:30px;font-size:40px;cursor:pointer;color:white;}
  .wm{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 40px);} 
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false" onmousedown="return false">

<div class="wm"></div>

<div class="filter-bar" id="filterBar"></div>
<div class="gallery" id="gallery"></div>

<div id="viewer" onclick="closeViewer()">
  <span id="closeBtn">&times;</span>
  <img id="fullImage" />
</div>

<script>
let images = [];

fetch('images/list.json')
  .then(r=>r.json())
  .then(data=>{ images = data; buildGallery(); buildFilters(); })
  .catch(()=>{ console.log('list.json not found'); });

function buildGallery(){
  const g = document.getElementById('gallery');
  g.innerHTML = '';
  images.forEach(img=>{
    const item = document.createElement('div');
    item.className = 'item ' + img.category;
    item.onclick = ()=>openViewer('images/' + img.file);
    item.innerHTML = `
      <img class='thumb' src='images/${img.file}' alt=''>
      <div class='filename'>${img.file}</div>
    `;
    g.appendChild(item);
  });
}

function openViewer(src){
  document.getElementById('fullImage').src = src;
  document.getElementById('viewer').style.display = 'flex';
}
function closeViewer(){ document.getElementById('viewer').style.display = 'none'; }

function buildFilters(){
  const bar = document.getElementById('filterBar');
  const cats = ['all', ...new Set(images.map(i=>i.category))];
  bar.innerHTML = cats.map(c=>`<button class='filter-btn' id='f_${c}' onclick="filterImages('${c}')">${c.toUpperCase()}</button>`).join('');
  document.getElementById('f_all').classList.add('active');
}

function filterImages(cat){
  const items = document.querySelectorAll('.item');
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('f_'+cat).classList.add('active');
  items.forEach(it=>{
    it.style.display = (cat==='all' || it.classList.contains(cat)) ? 'block' : 'none';
  });
}

document.addEventListener('keydown', e=>{
  if(e.key==='PrintScreen'){ alert('Screenshots disabled'); e.preventDefault(); }
  if(e.ctrlKey && (e.key==='s' || e.key==='S')) e.preventDefault();
  if(e.ctrlKey && e.shiftKey && (e.key==='I')) e.preventDefault();
  if(e.key==='F12') e.preventDefault();
});
</script>
</body>
</html>
